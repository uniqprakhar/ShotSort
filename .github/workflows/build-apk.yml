name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v3
      - run: chmod +x gradlew || true
      - run: |
          if [ ! -f gradlew ]; then
            echo "No wrapper, installing gradle 8.7"
            wget -q https://services.gradle.org/distributions/gradle-8.7-bin.zip -O /tmp/g.zip
            unzip -q /tmp/g.zip -d /tmp && export PATH=/tmp/gradle-8.7/bin:$PATH
            gradle wrapper --gradle-version 8.7 || true
          fi
      - run: ./gradlew :app:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with: { name: shotsort-apk, path: app/build/outputs/apk/debug/*.apk }
